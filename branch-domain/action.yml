name: Branch domain
description: Serves each <feature>.<integration> branch on <feature>.<integration>.<base-domain> while it exists (Vercel).
inputs:
  base-domain:
    description: The repository's domain (its production address). Empty skips, for projects on Vercel's own addresses.
    default: ""
  integration-branch:
    description: The branch features are integrated into.
    default: development
  vercel-project-id:
    description: The Vercel project (prj_…).
    default: ""
  vercel-team-id:
    description: The Vercel team (team_…).
    default: ""
  vercel-token:
    description: A Vercel token used only for this repository's branch domains.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version: "lts/*" }
    - name: Add or remove the branch's domain on Vercel
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BRANCH: ${{ github.event.ref }}
        BASE_DOMAIN: ${{ inputs.base-domain }}
        INTEGRATION_BRANCH: ${{ inputs.integration-branch }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_TEAM_ID: ${{ inputs.vercel-team-id }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: node --conditions=sharadox-source "$GITHUB_ACTION_PATH/../source/run-branch-domain/entry/index.ts"
