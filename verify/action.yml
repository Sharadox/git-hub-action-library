name: Verify
description: Installs the repository with pnpm and runs its checks through Turborepo (remote cache optional).
inputs:
  tasks:
    description: Turborepo tasks to run, separated by spaces.
    default: format:check lint type-check test:unit build
  browser:
    description: '"true" installs Playwright''s Chromium first (for end-to-end tests) and keeps the results on failure.'
    default: "false"
  npm-install-token:
    description: A read-only npm token for private packages (empty when every dependency is public).
    default: ""
  turborepo-token:
    description: Token for the Turborepo remote cache (empty runs without it).
    default: ""
  turborepo-team:
    description: Turborepo team.
    default: ""
  turborepo-remote-cache-signature-key:
    description: Key that signs remote cache artifacts.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with: { node-version-file: .node-version, cache: pnpm, registry-url: "https://registry.npmjs.org" }
    - name: Check package.json engines follows the current Node.js LTS
      shell: bash
      # .node-version is lts/*, which moves to each new LTS by itself; Vercel only reads package.json engines. This
      # fails when they part ways, so the move to a new LTS is made on purpose, everywhere at once.
      run: |
        node -e '
          const lts = Number(process.versions.node.split(".")[0]);
          const engines = require("./package.json").engines?.node ?? "";
          const major = Number(engines.match(/\d+/)?.[0]);
          if (major !== lts) {
            console.log(`::error::Node.js ${lts} is the current LTS (.node-version: lts/*), but package.json engines.node is "${engines}". Set it to "${lts}.x" (applications) or ">=${lts}" (libraries), and Vercel to ${lts}.x.`);
            process.exit(1);
          }
          console.log(`engines.node "${engines}" follows Node.js ${lts} LTS`);
        '
    - name: Install
      shell: bash
      env: { HUSKY: "0", NODE_AUTH_TOKEN: "${{ inputs.npm-install-token }}" }
      run: pnpm install --frozen-lockfile
    - name: Install the browser
      if: inputs.browser == 'true'
      shell: bash
      # Ubuntu's package mirrors are sometimes unreachable from the runners for long stretches. The runner image already
      # has Chrome's system libraries, so without the mirrors Chromium is installed on its own rather than failing.
      run: |
        timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
        echo "::warning::System packages unavailable; installing Chromium without them (the runner image has its libraries)."
        for attempt in 1 2 3; do
          pnpm exec playwright install chromium && exit 0
          sleep $((attempt * 15))
        done
        exit 1
    - name: Run the checks
      shell: bash
      env:
        TASKS: ${{ inputs.tasks }}
        TURBO_TOKEN: ${{ inputs.turborepo-token }}
        TURBO_TEAM: ${{ inputs.turborepo-team }}
        TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ inputs.turborepo-remote-cache-signature-key }}
      # Word splitting on purpose: TASKS is a space-separated list of task names.
      run: pnpm exec turbo run $TASKS
    - name: Keep the browser test results
      if: failure() && inputs.browser == 'true'
      uses: actions/upload-artifact@v7
      with: { name: playwright, path: "test-results/", retention-days: 7 }
