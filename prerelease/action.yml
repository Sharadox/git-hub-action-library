name: Prerelease
description: "On a push to development or <feature>.development, builds the package and publishes it to npm as a prerelease (0.52.0-hero.3) under the branch's dist-tag (development, or the feature's name), so sites can preview it before it's released. The calling job needs permissions contents: read and id-token: write."
inputs:
  tasks:
    description: Turborepo tasks to run before publishing (the checks themselves run in continuous integration).
    default: build
  npm-token:
    description: An npm token for this package only. Leave empty to use npm Trusted Publishing (recommended).
    default: ""
  turborepo-token:
    description: Token for the Turborepo remote cache (empty runs without it).
    default: ""
  turborepo-team:
    description: Turborepo team.
    default: ""
  turborepo-remote-cache-signature-key:
    description: Key that signs remote cache artifacts.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version-file: .node-version, cache: pnpm, registry-url: "https://registry.npmjs.org" }
    - name: Version the prerelease
      id: prerelease
      shell: bash
      env: { BRANCH: "${{ github.ref_name }}", RUN: "${{ github.run_number }}" }
      run: node --conditions=sharadox-source "$GITHUB_ACTION_PATH/../source/run-prerelease/entry/index.ts"
    - name: Install
      if: steps.prerelease.outputs.tag != ''
      shell: bash
      env: { HUSKY: "0" }
      run: pnpm install --frozen-lockfile
    - name: Build
      if: steps.prerelease.outputs.tag != ''
      shell: bash
      env:
        TASKS: ${{ inputs.tasks }}
        TURBO_TOKEN: ${{ inputs.turborepo-token }}
        TURBO_TEAM: ${{ inputs.turborepo-team }}
        TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ inputs.turborepo-remote-cache-signature-key }}
      run: pnpm exec turbo run $TASKS
    - name: Publish the prerelease to npm
      if: steps.prerelease.outputs.tag != ''
      shell: bash
      env: { NODE_AUTH_TOKEN: "${{ inputs.npm-token }}", TAG: "${{ steps.prerelease.outputs.tag }}" }
      run: |
        npm install --global npm@11.21.2 >/dev/null
        pnpm pack
        access="$(node -p 'require("./package.json").publishConfig?.access ?? "public"')"
        if [ "$access" = public ]; then npm publish ./*.tgz --tag "$TAG" --access public --provenance; else npm publish ./*.tgz --tag "$TAG" --access restricted; fi
